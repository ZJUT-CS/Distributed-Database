services:
  mysql:
    image: mysql:8.0
    container_name: ss-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-shardingsphere}
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - ss-net

  proxy:
    image: apache/shardingsphere-proxy:5.5.2
    container_name: ss-proxy
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "3307:3307"
    volumes:
      - ./conf:/opt/shardingsphere-proxy/conf
      - ./logs:/opt/shardingsphere-proxy/logs
      - ./ext-lib:/opt/shardingsphere-proxy/ext-lib
    networks:
      - ss-net

networks:
  ss-net:
    name: ss-net
    driver: bridge
