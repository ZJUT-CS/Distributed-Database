mode:
  type: Standalone
  repository:
    type: JDBC
    props:
      provider: H2
      jdbc_url: jdbc:h2:mem:config;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;MODE=MYSQL
authority:
  users:
    - user: root@%
      password: shardingsphere
  privilege:
    type: ALL_PERMITTED
props:
  sql-show: true
  kernel-executor-size: 16
  max-connections-size-per-query: 4
  proxy-backend-query-fetch-size: -1
  proxy-frontend-flush-threshold: 256
  proxy-frontend-max-connections: 0
  sql-federation-enabled: false
  show-process-list-enabled: true
  check-table-metadata-enabled: false