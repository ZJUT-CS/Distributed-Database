  ds_1:
    url: jdbc:mysql://26.47.189.229:3306/zf_db_1?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: zf
    password: 123456
    connectionTimeoutMilliseconds: 30000
    idleTimeoutMilliseconds: 60000
    maxLifetimeMilliseconds: 1800000
