rules:
- !SHARDING
  tables:
    # -------------------------------------------------------
    # 1. 用户域 (按 user_id 分片)
    # -------------------------------------------------------
    users:
      actualDataNodes: ds_${0..2}.users
      databaseStrategy:
        standard:
          shardingColumn: user_id
          shardingAlgorithmName: user_id_inline
      keyGenerateStrategy:
        column: user_id
        keyGeneratorName: snowflake

    # -------------------------------------------------------
    # 2. 航班域 (按 flight_id 分片，绑定)
    # -------------------------------------------------------
    flights:
      actualDataNodes: ds_${0..2}.flights
      databaseStrategy:
        standard:
          shardingColumn: flight_id
          shardingAlgorithmName: flight_id_inline
      keyGenerateStrategy:
        column: flight_id
        keyGeneratorName: snowflake

    seat:
      actualDataNodes: ds_${0..2}.seat
      databaseStrategy:
        standard:
          shardingColumn: flight_id
          shardingAlgorithmName: flight_id_inline
      keyGenerateStrategy:
        column: seat_id
        keyGeneratorName: snowflake

    # -------------------------------------------------------
    # 3. 订单域 (orders 保持按 user_id 分片)
    # 注意：orders 表必须有 user_id 字段
    # -------------------------------------------------------
    orders:
      actualDataNodes: ds_${0..2}.orders
      databaseStrategy:
        standard:
          shardingColumn: user_id
          shardingAlgorithmName: user_id_inline
      keyGenerateStrategy:
        column: order_id
        keyGeneratorName: snowflake

    # -------------------------------------------------------
    # 4. 支付与退改 (回退为按 order_id 分片)
    # 修改原因：代码 INSERT 中没有 user_id，必须用 order_id 分片
    # -------------------------------------------------------
    payments:
      actualDataNodes: ds_${0..2}.payments
      databaseStrategy:
        standard:
          shardingColumn: order_id   # <--- 改回 order_id
          shardingAlgorithmName: order_id_inline
      keyGenerateStrategy:
        column: payment_id
        keyGeneratorName: snowflake

    refund_change_record:
      actualDataNodes: ds_${0..2}.refund_change_record
      databaseStrategy:
        standard:
          shardingColumn: order_id   # <--- 改回 order_id
          shardingAlgorithmName: order_id_inline
      keyGenerateStrategy:
        column: record_id
        keyGeneratorName: snowflake

    # -------------------------------------------------------
    # 5. 系统域
    # -------------------------------------------------------
    system_config:
      actualDataNodes: ds_${0..2}.system_config
      databaseStrategy:
        standard:
          shardingColumn: config_id
          shardingAlgorithmName: config_id_inline
      keyGenerateStrategy:
        column: config_id
        keyGeneratorName: snowflake

    system_log:
      actualDataNodes: ds_${0..2}.system_log
      databaseStrategy:
        standard:
          shardingColumn: log_id
          shardingAlgorithmName: log_id_inline
      keyGenerateStrategy:
        column: log_id
        keyGeneratorName: snowflake

  # -------------------------------------------------------
  # 绑定表规则
  # 注意：这里去掉了 orders 和 payments 的绑定，因为它们分片键不一样了
  # -------------------------------------------------------
  bindingTables:
    - flights, seat

  defaultDatabaseStrategy:
    none:
  defaultTableStrategy:
    none:

  # -------------------------------------------------------
  # 分片算法
  # -------------------------------------------------------
  shardingAlgorithms:
    user_id_inline:
      type: INLINE
      props:
        algorithm-expression: ds_${user_id % 3}
    
    flight_id_inline:
      type: INLINE
      props:
        algorithm-expression: ds_${flight_id % 3}

    # 必须补回 order_id 的算法
    order_id_inline:
      type: INLINE
      props:
        algorithm-expression: ds_${order_id % 3}

    log_id_inline:
      type: INLINE
      props:
        algorithm-expression: ds_${log_id % 3}
        
    config_id_inline:
      type: INLINE
      props:
        algorithm-expression: ds_${config_id % 3}

  keyGenerators:
    snowflake:
      type: SNOWFLAKE
      props:
        worker-id: 123

# -------------------------------------------------------
# 广播表
# -------------------------------------------------------
- !BROADCAST
  tables:
    - admins
    - aircraft_models
    - aircraft_cabin_configs
    - routes
    - lal