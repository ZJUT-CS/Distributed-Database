rules:
- !SHARDING
  tables:
    # 1. 用户表
    users:
      actualDataNodes: ds_${0..2}.users
      databaseStrategy:
        standard:
          shardingColumn: user_id
          shardingAlgorithmName: user_id_inline
      keyGenerateStrategy:
        column: user_id
        keyGeneratorName: snowflake

    # 2. 航班表 (按 flight_id 分片)
    flights:
      actualDataNodes: ds_${0..2}.flights
      databaseStrategy:
        standard:
          shardingColumn: flight_id
          shardingAlgorithmName: flight_id_inline
      keyGenerateStrategy:
        column: flight_id
        keyGeneratorName: snowflake

    # 3. 座位表 (按 flight_id 分片，必须与 flights 在同库)
    seat:
      actualDataNodes: ds_${0..2}.seat
      databaseStrategy:
        standard:
          shardingColumn: flight_id 
          shardingAlgorithmName: flight_id_inline # 复用算法，确保同 flight_id 在同库
      keyGenerateStrategy:
        column: seat_id 
        keyGeneratorName: snowflake 

    # 4. 订单表
    orders:
      actualDataNodes: ds_${0..2}.orders
      databaseStrategy:
        standard:
          shardingColumn: user_id
          shardingAlgorithmName: user_id_inline
      keyGenerateStrategy:
        column: order_id
        keyGeneratorName: snowflake

    # 5. 支付表
    payments:
      actualDataNodes: ds_${0..2}.payments
      databaseStrategy:
        standard:
          shardingColumn: order_id
          shardingAlgorithmName: order_id_inline
      keyGenerateStrategy:
        column: payment_id
        keyGeneratorName: snowflake

    # 6. 退改签表
    refund_change_record:
      actualDataNodes: ds_${0..2}.refund_change_record
      databaseStrategy:
        standard:
          shardingColumn: order_id
          shardingAlgorithmName: order_id_inline 
      keyGenerateStrategy:
        column: record_id
        keyGeneratorName: snowflake

    # 7. 系统配置
    system_config:
      actualDataNodes: ds_${0..2}.system_config
      databaseStrategy:
        standard:
          shardingColumn: config_id
          shardingAlgorithmName: config_id_inline
      keyGenerateStrategy:
        column: config_id
        keyGeneratorName: snowflake

    # 8. 系统日志
    system_log:
      actualDataNodes: ds_${0..2}.system_log
      databaseStrategy:
        standard:
          shardingColumn: log_id
          shardingAlgorithmName: log_id_inline
      keyGenerateStrategy:
        column: log_id
        keyGeneratorName: snowflake

  # 绑定表规则
  # 修改点：去掉了 cabins，只绑定 flights 和 seat
  bindingTables:
    - flights, seat                      # 航班和座位强关联，分片键都是 flight_id
    - orders, payments, refund_change_record # 交易链路绑定

  defaultDatabaseStrategy:
    none:
  defaultTableStrategy:
    none:

  shardingAlgorithms:
    user_id_inline:
      type: INLINE
      props:
        algorithm-expression: ds_${user_id % 3}
    flight_id_inline:
      type: INLINE
      props:
        algorithm-expression: ds_${flight_id % 3}
    order_id_inline:
      type: INLINE
      props:
        algorithm-expression: ds_${order_id % 3}
    log_id_inline:
      type: INLINE
      props:
        algorithm-expression: ds_${log_id % 3}
    config_id_inline:
      type: INLINE
      props:
        algorithm-expression: ds_${config_id % 3}

  keyGenerators:
    snowflake:
      type: SNOWFLAKE
      props:
        worker-id: 123

# 广播表配置
- !BROADCAST
  tables:
    - admins
    - aircraft_models
    - aircraft_cabin_configs # 配置表是广播表，没问题
    - routes                 # 航线表是广播表，没问题
    - LAL