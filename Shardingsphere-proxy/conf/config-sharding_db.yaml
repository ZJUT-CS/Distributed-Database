databaseName: sharding_db

dataSources:
  db0:
    url: jdbc:mysql://ss-mysql:3306/db_xuc_core_00?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: shardingsphere
    connectionTimeoutMilliseconds: 30000
