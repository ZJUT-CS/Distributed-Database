rules:
- !SHARDING
  tables:
    # 1. 用户表 (对应 users 表，按 user_id 分片)
    users:
      actualDataNodes: ds_${0..2}.users
      databaseStrategy:
        standard:
          shardingColumn: user_id
          shardingAlgorithmName: user_id_inline
      keyGenerateStrategy:
        column: user_id
        keyGeneratorName: snowflake

    # 2. 航班表 (对应 flights 表，按 flight_id 分片)
    flights:
      actualDataNodes: ds_${0..2}.flights
      databaseStrategy:
        standard:
          shardingColumn: flight_id
          shardingAlgorithmName: flight_id_inline
      keyGenerateStrategy:
        column: flight_id
        keyGeneratorName: snowflake

    # 3. 舱位表 (对应 cabins 表，与航班表绑定分片)
    cabins:
      actualDataNodes: ds_${0..2}.cabins
      databaseStrategy:
        standard:
          shardingColumn: flight_id
          shardingAlgorithmName: flight_id_inline # 与航班表同分片键，优化关联查询
      keyGenerateStrategy:
        column: cabin_id
        keyGeneratorName: snowflake

    # 4. 机票订单表 (对应 orders 表，按 user_id 分片)
    orders:
      actualDataNodes: ds_${0..2}.orders
      databaseStrategy:
        standard:
          shardingColumn: user_id
          shardingAlgorithmName: user_id_inline
      keyGenerateStrategy:
        column: order_id
        keyGeneratorName: snowflake

    # 5. 支付订单表 (对应 payments 表，按 order_id 分片)
    payments:
      actualDataNodes: ds_${0..2}.payments
      databaseStrategy:
        standard:
          shardingColumn: order_id
          shardingAlgorithmName: order_id_inline
      keyGenerateStrategy:
        column: payment_id
        keyGeneratorName: snowflake

    # 6. 退票/改签记录表 (对应 refund_change_record 表，按 order_id 分片)
    refund_change_record:
      actualDataNodes: ds_${0..2}.refund_change_record
      databaseStrategy:
        standard:
          shardingColumn: order_id
          shardingAlgorithmName: order_id_inline # 与支付表同分片键，优化关联查询
      keyGenerateStrategy:
        column: record_id
        keyGeneratorName: snowflake

    # 7. 系统配置表 (对应 system_config 表，按 config_id 分片)
    system_config:
      actualDataNodes: ds_${0..2}.system_config
      databaseStrategy:
        standard:
          shardingColumn: config_id
          shardingAlgorithmName: config_id_inline
      keyGenerateStrategy:
        column: config_id
        keyGeneratorName: snowflake

    # 8. 系统操作日志表 (对应 system_log 表，按 log_id 分片)
    system_log:
      actualDataNodes: ds_${0..2}.system_log
      databaseStrategy:
        standard:
          shardingColumn: log_id
          shardingAlgorithmName: log_id_inline
      keyGenerateStrategy:
        column: log_id
        keyGeneratorName: snowflake

  # 绑定表规则（优化关联查询性能，同分片键的表绑定）
  bindingTables:
    - flights, cabins # 航班与舱位强关联，同分片
    - orders, payments, refund_change_record # 订单、支付、退改签强关联，同分片
    - system_config # 单表绑定（可选，便于扩展）
    - system_log # 单表绑定（可选，便于扩展）

  # 默认分片策略（未明确配置的表使用）
  defaultDatabaseStrategy:
    none:
  defaultTableStrategy:
    none:

  # 分片算法配置（新增 config_id 算法，其余复用原有）
  shardingAlgorithms:
    # 基于 user_id 取模 3
    user_id_inline:
      type: INLINE
      props:
        algorithm-expression: ds_${user_id % 3}
    
    # 基于 flight_id 取模 3
    flight_id_inline:
      type: INLINE
      props:
        algorithm-expression: ds_${flight_id % 3}
        
    # 基于 order_id 取模 3
    order_id_inline:
      type: INLINE
      props:
        algorithm-expression: ds_${order_id % 3}

    # 基于 log_id 取模 3
    log_id_inline:
      type: INLINE
      props:
        algorithm-expression: ds_${log_id % 3}

    # 基于 config_id 取模 3（新增，适配 system_config 表）
    config_id_inline:
      type: INLINE
      props:
        algorithm-expression: ds_${config_id % 3}

  # 分布式主键生成器（复用雪花算法，与 SQL 表中主键生成逻辑一致）
  keyGenerators:
    snowflake:
      type: SNOWFLAKE
      props:
        worker-id: 123

- !BROADCAST
  tables:
    - admins # 管理员表（广播表，所有分片同步数据，适配全局查询）
    - temp_cabin_data  # 新增：将临时表设为广播表