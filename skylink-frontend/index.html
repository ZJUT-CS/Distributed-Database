<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyLink - 航班预订</title>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              admin: {
                bg: '#f8fafc',
                surface: '#ffffff',
                border: '#e5e7eb',
                text: '#111827',
                muted: '#6b7280',
                primary: '#2563eb',
                'primary-hover': '#1d4ed8',
                danger: '#dc2626',
                'danger-hover': '#b91c1c',
                purple: '#7c3aed',
                indigo: '#4f46e5',
              },
            },
            borderRadius: {
              admin: '0.75rem',
              'admin-lg': '1rem',
            },
            boxShadow: {
              admin: '0 1px 2px 0 rgb(0 0 0 / 0.05)',
              'admin-md': '0 4px 12px -4px rgb(0 0 0 / 0.12)',
            },
            fontSize: {
              'admin-base': ['14px', { lineHeight: '20px' }],
              'admin-h1': ['30px', { lineHeight: '36px' }],
              'admin-h2': ['24px', { lineHeight: '32px' }],
              'admin-h3': ['18px', { lineHeight: '26px' }],
              'admin-tooltip': ['12px', { lineHeight: '16px' }],
            },
            spacing: {
              'admin-tooltip': '12px',
            },
            width: {
              'admin-tooltip': '280px',
            },
            backgroundImage: {
              'admin-gradient-primary': 'linear-gradient(to right, #2563eb, #4f46e5)',
              'admin-gradient-purple': 'linear-gradient(to right, #7c3aed, #4f46e5)',
              'admin-gradient-indigo': 'linear-gradient(to right, #4f46e5, #2563eb)',
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Noto Sans SC', sans-serif;
      }
      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1; 
      }
      ::-webkit-scrollbar-thumb {
        background: #c1c1c1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a8a8a8; 
      }
      /* AdminDrawer slide-in animation */
      @keyframes slide-in-right {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }
      .animate-slide-in-right {
        animation: slide-in-right 0.3s ease-out forwards;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-slate-800 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
